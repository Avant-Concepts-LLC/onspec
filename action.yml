name: onspec
description: >-
  Spec conformance for PRs: checks the diff against governing specs/*.spec.md,
  posts a criterion-level verdict table as a PR comment, and flags drift.
branding:
  icon: check-square
  color: green
inputs:
  base:
    description: Base ref to diff against (defaults to the PR base SHA)
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Head ref (defaults to the PR head SHA)
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  test-results:
    description: Path to a JUnit XML report from your test job
    required: false
    default: ""
  anthropic-api-key:
    description: API key for LLM assessment of criteria without deterministic evidence
    required: false
    default: ""
  strict:
    description: Fail the job on unmet criteria or drift (advisory by default)
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run onspec
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}"
        npm ci --omit=dev --silent
        npm run build --silent
        cd "${GITHUB_WORKSPACE}"

        # On pull_request the defaults are the PR base/head SHAs; on push
        # events those are empty, so fall back to the previous commit.
        BASE="${{ inputs.base }}"; [ -z "$BASE" ] && BASE="HEAD~1"
        HEAD_REF="${{ inputs.head }}"

        ARGS=(--base "$BASE" --format markdown --output onspec-report.md)
        [ -n "$HEAD_REF" ] && ARGS+=(--head "$HEAD_REF")
        [ -n "${{ inputs.test-results }}" ] && ARGS+=(--test-results "${{ inputs.test-results }}")
        [ -z "${ANTHROPIC_API_KEY}" ] && ARGS+=(--no-llm)
        [ "${{ inputs.strict }}" = "true" ] && ARGS+=(--strict)

        node "${GITHUB_ACTION_PATH}/dist/cli.js" verify "${ARGS[@]}"
        DRIFT_ARGS=(--base "$BASE" --format markdown --output onspec-drift.md)
        [ -n "$HEAD_REF" ] && DRIFT_ARGS+=(--head "$HEAD_REF")
        [ "${{ inputs.strict }}" = "true" ] && DRIFT_ARGS+=(--strict)
        node "${GITHUB_ACTION_PATH}/dist/cli.js" drift "${DRIFT_ARGS[@]}" || DRIFT_FAILED=$?
        cat onspec-drift.md >> onspec-report.md
        cat onspec-report.md >> "$GITHUB_STEP_SUMMARY"
        [ "${{ inputs.strict }}" = "true" ] && [ -n "${DRIFT_FAILED:-}" ] && exit 1 || true
    - name: Post PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('onspec-report.md', 'utf8');
          const marker = '<!-- onspec-report -->';
          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo, issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes(marker));
          const payload = { ...context.repo, body: `${marker}\n${body}` };
          if (existing) {
            await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
          } else {
            await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
          }
