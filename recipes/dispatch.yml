# onspec dispatch — the reference workflow closing the plan-to-code loop.
#
# When a spec merges to main as `status: approved` and its criteria are not
# yet met, this workflow opens a work-order issue containing everything an
# agent (or a human) needs to implement it. The issue is the tool-agnostic
# handoff point: assign it to Claude Code's GitHub app, a Copilot agent,
# a cloud agent watching the label, or a person.
#
# The insight this automates: an approved spec with unmet criteria IS the
# work queue. No separate task list to maintain.
#
# Setup:
#   1. Copy this file to .github/workflows/dispatch.yml in your repo.
#   2. Adjust the "Run tests" step to your test command (JUnit XML output).
#   3. Optional: connect your coding agent to the `onspec-dispatch` label.
#
# The loop this creates:
#   spec PR approved & merged  →  work-order issue opened   (this workflow)
#   agent implements, opens PR →  onspec verifies the PR    (onspec action)
#   criteria met               →  humans merge              (or autonomy policy)
#   forever after              →  drift detection guards it

name: onspec dispatch
on:
  push:
    branches: [main]
    paths: ["specs/**"]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Customize: run YOUR tests with JUnit output so verdicts are anchored.
      - name: Run tests
        run: |
          npm ci
          npm run test:junit || true

      - name: Verify all specs
        run: npx --yes onspec@1 verify --all --test-results test-results.xml --no-llm --format json --output verdicts.json

      - name: Which spec files changed in this push
        run: git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- specs/ > changed-specs.txt || true

      - name: Open work-order issues for approved, unmet specs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const verdicts = JSON.parse(fs.readFileSync('verdicts.json', 'utf8'));
            const changed = fs.readFileSync('changed-specs.txt', 'utf8').split('\n').filter(Boolean);

            for (const spec of verdicts.specs) {
              if (spec.status !== 'approved') continue;
              if (!changed.includes(spec.path)) continue;
              const open = spec.criteria.filter(c => c.verdict === 'unmet' || c.verdict === 'uncertain');
              if (open.length === 0) continue; // already delivered

              const title = `Implement ${spec.id}: ${spec.title}`;
              const { data: existing } = await github.rest.issues.listForRepo({
                ...context.repo, state: 'open', labels: 'onspec-dispatch', per_page: 100,
              });
              if (existing.some(i => i.title.startsWith(`Implement ${spec.id}:`))) continue;

              const rows = spec.criteria.map(c =>
                `| ${c.id} | ${c.verdict} | ${c.text.replace(/\|/g, '\\|')} |`).join('\n');
              const body = [
                `**Work order from an approved spec.** \`${spec.path}\` merged as approved with ${open.length} undelivered criteria.`,
                '',
                '| Criterion | Verdict | Text |', '|---|---|---|', rows,
                '',
                '## For the implementing agent',
                `1. Read the full spec at \`${spec.path}\` — it is the complete task definition, including non-goals.`,
                '2. Implement so every criterion has real evidence: write the tests the criteria name, keep evidence pointers accurate.',
                `3. Before opening a PR, run: \`npx onspec verify --base origin/main --test-results <junit.xml>\``,
                '4. Open a PR referencing this issue. The onspec check on the PR is the acceptance gate.',
                '5. Do not edit the spec to make it pass. If the spec is wrong, say so on this issue instead.',
              ].join('\n');

              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['onspec-dispatch'],
              });
              core.info(`Opened work order: ${title}`);
            }

      # Optional: instead of (or in addition to) issues, invoke a coding agent
      # directly. Example for Claude Code's GitHub integration — uncomment and
      # see https://github.com/anthropics/claude-code-action for setup:
      #
      # - uses: anthropics/claude-code-action@v1
      #   with:
      #     anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      #     prompt: "Implement the newly approved specs listed in verdicts.json whose criteria are unmet. Open one PR per spec."
